name: CI/CD Pipeline

on:
  push:
    branches:
      - dev # dev 브랜치에 푸시될 때 워크플로우가 실행됩니다.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # 최신 Ubuntu 환경에서 실행

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: dev # dev 브랜치 체크아웃 (필요에 따라 main으로 변경 가능)

    - name: Set up Java 17 for Backend
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin' # Adoptium Temurin 배포판 사용
        cache: 'gradle' # Gradle 캐싱 활성화

    - name: Build Backend (Spring Boot)
      run: |
        chmod +x ./gradlew # gradlew 실행 권한 부여
        ./gradlew clean build -x test # 테스트 제외 빌드 (필요시 테스트 포함)
      working-directory: bookitout-back/bookitout # 백엔드 디렉토리에서 실행

    - name: Set up Node.js for Frontend
      uses: actions/setup-node@v4
      with:
        node-version: '18' # Node.js 18 LTS 버전 사용
        cache: 'npm' # npm 캐싱 활성화
      
    - name: Build Frontend (React)
      run: |
        npm install # 의존성 설치
        npm run build # React 애플리케이션 빌드
      working-directory: bookitout-front # 프론트엔드 디렉토리에서 실행

    - name: Set up Python for Flask Crawler
      uses: actions/setup-python@v5
      with:
        python-version: '3.x' # 최신 Python 3 버전 사용
        cache: 'pip' # pip 캐싱 활성화

    - name: Build Flask (Python Crawler)
      run: |
        python3 -m venv venv # 가상 환경 생성
        source venv/bin/activate # 가상 환경 활성화
        pip install -r requirements.txt # 의존성 설치
      working-directory: bookitout-flask/crawler # Flask 디렉토리에서 실행
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Backend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./bookitout-back/bookitout
        push: true
        tags: yuhyejin/bookitout-backend:latest

    - name: Build and Push Frontend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./bookitout-front
        push: true
        tags: yuhyejin/bookitout-frontend:latest

    - name: Build and Push Flask Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./bookitout-flask/crawler
        push: true
        tags: yuhyejin/bookitout-flask-crawler:latest
