user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name bookitout.site; # 여기에 실제 도메인 이름을 입력하세요 (예: example.com)

        # Certbot 챌린지 요청을 위한 경로
        location /.well-known/acme-challenge/ {
            root /var/www/certbot; # Certbot이 파일을 둘 경로
            allow all;
        }

        # React/Next.js 프론트엔드 애플리케이션을 서비스하는 설정
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 정적 파일 캐싱 설정
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # API 요청을 백엔드 서비스로 프록시 (필요시 주석 해제하여 사용)
        # location /api/v1/ {
        #     proxy_pass http://backend:8000;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # Flask 크롤러 API 요청을 프록시 (필요시 주석 해제하여 사용)
        # location /crawler/ {
        #     proxy_pass http://flask:5000; # Flask 컨테이너의 내부 포트
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }
    }
} 