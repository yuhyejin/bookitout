user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # ✅ HTTP → HTTPS 리디렉션 서버
    server {
        listen 80;
        server_name bookitout.site www.bookitout.site;

        # Certbot 인증 경로는 허용
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # 그 외는 HTTPS로 리디렉션
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ✅ 실제 HTTPS 서버
    server {
        listen 443 ssl;
        server_name bookitout.site www.bookitout.site;

        ssl_certificate /etc/letsencrypt/live/bookitout.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bookitout.site/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # React 정적 파일 서비스 경로
        root /usr/share/nginx/html;

        location / {
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 정적 리소스 캐시
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # 백엔드 API 프록시 설정
        location /api/ {
            proxy_pass http://backend:8000;  # backend 컨테이너 서비스 이름과 포트
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # 예: Flask 크롤러 API 프록시
        # location /crawler/ {
        #     proxy_pass http://flask:5000;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }
    }
}
