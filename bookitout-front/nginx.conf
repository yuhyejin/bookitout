user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        # listen 443 ssl; # 443 포트에서 SSL을 활성화 - 임시 주석 처리
        server_name bookitout.site; # 여기에 실제 도메인 이름을 입력하세요 (예: example.com)

        # HTTP를 HTTPS로 리다이렉트 (Certbot 챌린지 제외) - 인증서 발급 후 활성화
        location / {
            # if ($scheme = http) {
            #     return 301 https://$server_name$request_uri;
            # }
            try_files $uri $uri/ /index.html;
        }

        # Let\'s Encrypt (Certbot) 인증서 갱신을 위한 경로
        location /.well-known/acme-challenge/ {
            root /var/www/certbot; # Certbot이 파일을 둘 경로
            allow all;
        }

        # API 요청을 백엔드 서비스로 프록시 - 임시 주석 처리
        # location /api/v1/ {
        #     proxy_pass http://backend:8000;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # SSL 인증서 경로 설정 - 임시 주석 처리
        # ssl_certificate /etc/nginx/ssl/live/bookitout.site/fullchain.pem; # 여기에 실제 도메인 이름 입력
        # ssl_certificate_key /etc/nginx/ssl/live/bookitout.site/privkey.pem; # 여기에 실제 도메인 이름 입력

        # ssl_session_cache shared:SSL:10m;
        # ssl_session_timeout 10m;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_prefer_server_ciphers on;
        # ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';

        # 정적 파일 캐싱 설정
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
} 