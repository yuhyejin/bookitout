user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # ✅ HTTP → HTTPS 리디렉션용 서버
    server {
        listen 80;
        server_name bookitout.site www.bookitout.site;

        # Certbot 인증 경로는 예외로 허용
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # 나머지는 HTTPS로 리다이렉트
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ✅ 실제 HTTPS 서버 (React 앱 서비스)
    server {
        listen 443 ssl;
        server_name bookitout.site www.bookitout.site;

        ssl_certificate /etc/letsencrypt/live/bookitout.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bookitout.site/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # React 정적 파일 서비스
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 정적 리소스 캐싱
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # 필요한 경우 백엔드 API 프록시 설정
        # location /api/v1/ {
        #     proxy_pass http://backend:8000;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # Flask 크롤러 API 프록시 설정
        # location /crawler/ {
        #     proxy_pass http://flask:5000;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }
    }
}
