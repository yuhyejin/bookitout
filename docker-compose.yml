version: '3.8'
services:
  backend:
    build: ./bookitout-back
    ports:
      - "${SPRING_PORT}:8000"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - mysql

  flask:
    build: ./bookitout-flask
    ports:
      - "${FLASK_PORT}:5000"

  frontend:
    build: ./bookitout-front
    ports:
      - "${REACT_PORT}:80"

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
