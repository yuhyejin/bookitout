services:
  backend:
    build:
      context: ./bookitout-back/bookitout
    ports:
      - "8000:8000"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    env_file:
      - ./bookitout-back/bookitout/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  flask:
    build:
      context: ./bookitout-flask/crawler
    ports:
      - "5001:5000"
    command: ["python", "main.py"]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "www.michuhollib.go.kr:203.233.111.1"

  frontend:
    build:
      context: ./bookitout-front
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8000

  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=bookitout
      - MYSQL_USER=developer
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "developer", "-p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.0
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql-data:
  redis-data:
